apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: employee-app-uat
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/achalpadol/EKS-Helm-Chart.git
    targetRevision: main
    path: dev-chart

    helm:
      valueFiles:
        - values-uat.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: app-uat

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true