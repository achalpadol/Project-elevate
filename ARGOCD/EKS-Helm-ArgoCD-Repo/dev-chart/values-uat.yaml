frontend:
  enabled: true
  name: frontend
  replicaCount: 1
  image:
    repository: "docker.io/achalpadol/employee-frontend"
    tag: "v2"
    pullPolicy: IfNotPresent
  service:
    enabled: true
    name: frontend
    type: ClusterIP
    port: 80
    targetPort: 80

backend:
  enabled: true
  name: backend
  replicaCount: 1
  image:
    repository: "docker.io/achalpadol/employee-backend"
    tag: "v1"
    pullPolicy: IfNotPresent
  configMapName: employee-cm
  secretName: mysql-secret
  service:
    enabled: true
    name: backend
    type: ClusterIP
    port: 5000
    targetPort: 5000

database:
  enabled: true
  name: database
  replicaCount: 1
  image:
    repository: "mysql"
    tag: "8.0"
    pullPolicy: IfNotPresent
  secretName: mysql-secret
  service:
    enabled: true
    name: database
    type: ClusterIP
    port: 3306
    targetPort: 3306
  persistence:
    enabled: true
    size: 10Gi

configMap:
  enabled: true
  name: employee-cm
  data:
    DB_HOST: database
    DB_PORT: "3306"

secret:
  enabled: true
  name: mysql-secret
  stringData:
    MYSQL_ROOT_PASSWORD: "rootpassword"
    MYSQL_DATABASE: employee_db
    MYSQL_USER: employee
    MYSQL_PASSWORD: "employee123"

ingress:
  enabled: true
  name: employee-management-ingress
  className: alb
  scheme: internet-facing
  targetType: ip
  host: employee.uat.local
