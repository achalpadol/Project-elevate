apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: app2
spec:
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
        - name: db
          image: mariadb:10-focal
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_DATABASE
              value: "example"

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: db-password

          volumeMounts:
            - name: db-data
              mountPath: /var/lib/mysql

      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc
