
apiVersion: apps/v1
kind: Deployment

metadata:
  name: app-backend
  namespace: app3

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: docker.io/payalkharat/kubernetes-ingress:app3-backend-v1

          ports:
            - containerPort: 8080

          env:
            - name: MYSQL_HOST
              value: db

            - name: MYSQL_DATABASE
              value: example

            - name:  MYSQL_USER
              value: root

          volumeMounts:
            - name: db-password
              mountPath: /run/secrets/db-password
              subPath: db-password
              readOnly: true

      volumes:
        - name: db-password
          secret:
            secretName: backend-secret
            items:
              - key: MYSQL_ROOT_PASSWORD
                path: db-password
            

