apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2-backend
  template:
    metadata:
      labels:
        app: app2-backend
    spec:
      containers:
        - name: backend
          image: docker.io/achalpadol/employee-backend:v1
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: mysql-service
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

            - name: DB_PORT
              value: "3306"

            - name: PORT
              value: "5000"