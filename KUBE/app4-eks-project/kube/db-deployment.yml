apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: eks-4
spec:
  replicas: 1

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db

    spec:
      containers:
        - name: postgress
          image: docker.io/achalpadol/react-rust-post-db:v1

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRESS-DB
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: PG_DBNAME

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: PG_PASSWORD

          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: db-data
          emptyDir: {}
