

frontend:
  replicaCount: 1
  image:
    repository: docker.io/achalpadol/employee-frontend
    tag: "v2"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

backend:
  replicaCount: 1
  image:
    repository: docker.io/achalpadol/employee-backend
    tag: "v1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

database:
  replicaCount: 1
  image:
    repository: mysql
    tag: 8
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3306
    targetPort: 3306
  persistence:
    enabled: true
    size: 10Gi

